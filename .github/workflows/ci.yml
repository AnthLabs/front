name: Front CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FRONT_HEALTH_URL: https://front-production-b0a2.up.railway.app

jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    needs: install

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint

  build:
    name: Vite build
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: anthlabs-front:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trivy:
    name: Trivy scan
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - uses: actions/checkout@v4

      - run: docker build -t anthlabs-front:test .

      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: anthlabs-front:test
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0

  smoke:
    name: Smoke test Railway
    runs-on: ubuntu-latest
    needs: trivy
    if: github.event_name == 'push'

    steps:
      - name: Wait before healthcheck
        run: sleep 60

      - name: Check front availability
        run: |
          for i in {1..10}; do
            echo "Front healthcheck attempt $i..."
            if curl -fsS "$FRONT_HEALTH_URL"; then
              echo "Front is reachable"
              exit 0
            fi
            sleep 15
          done

          echo "Front healthcheck failed"
          exit 1